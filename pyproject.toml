[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-powerflow-solver"
version = "1.0.1"
description = "Sparse CSC Newton-Raphson AC power-flow solver with PV Q-limit switching, N-1 contingency screening, and P-V voltage stability analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Haris Zafar"}
]
keywords = [
    "power-systems",
    "load-flow",
    "newton-raphson",
    "sparse-matrix",
    "contingency-analysis",
    "voltage-stability",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/hariszafar740-lang/power-systems-newton-raphson-solver"
Repository = "https://github.com/hariszafar740-lang/power-systems-newton-raphson-solver"
Issues = "https://github.com/hariszafar740-lang/power-systems-newton-raphson-solver/issues"
Changelog = "https://github.com/hariszafar740-lang/power-systems-newton-raphson-solver/releases"

[project.scripts]
nr-powerflow = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
