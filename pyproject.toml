# Tool configuration only: this repository is a script-based project and is
# not installed as a distribution.  Python >= 3.10 is required (see README and
# the CI matrix in .github/workflows/ci.yml).

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
