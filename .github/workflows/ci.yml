name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest + ruff (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=61.0"
          pip install -r requirements.txt ruff
          pip install --no-build-isolation -e .

      - name: Lint with Ruff
        run: ruff check .

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Smoke-run main entry point and nr-powerflow CLI
        run: |
          python main.py
          nr-powerflow --version
          nr-powerflow solve --case ieee30 --format json > /dev/null
